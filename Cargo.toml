[package]
name = "skald"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37.0"
egui_extras = { version = "0.37.0", features = ["all_loaders"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "webp", "gif", "ico"] }
libloot = "0.29.7"
rfd = "0.18.0"
roxmltree = "0.21.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = "0.25.0"
ureq = "3"
walkdir = "2.5.0"
zip = "9.7.0"

[dev-dependencies]
tempfile = "3.27.0"
